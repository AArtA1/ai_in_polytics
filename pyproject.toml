[project]
name = "ai-in-politics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.1",
    "beautifulsoup4>=4.14.2",
    "fastapi>=0.119.0",
    "lxml>=6.0.2",
    "openai>=2.3.0",
    "python-dotenv>=1.0.0",
    "python-slugify>=8.0.4",
    "qdrant-client>=1.15.1",
    "requests>=2.32.5",
    "safetensors>=0.6.2",
    "sentence-transformers>=5.1.1",
    "tldextract>=5.3.0",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "trafilatura>=1.6.1",
    "transformers>=4.57.0",
    "uvicorn>=0.37.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
# ============================================================================
# RUFF CONFIGURATION  
# ============================================================================
# Настройки ruff - работает только если ruff установлен в проекте
# Команды для запуска: uv run ruff check . | uv run ruff format .
[tool.ruff]
# Python files to check
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# Rules to enable
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

# Rules to ignore
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "B904",  # Allow raising exceptions without from e
    "B905",  # Allow zip without strict parameter
]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "pylint>=3.3.8",
    "ruff>=0.13.3",
]

# ============================================================================
# PYLINT CONFIGURATION
# ============================================================================
# Настройки pylint - работает только если pylint установлен в проекте
# Команда для запуска: uv run pylint .
[tool.pylint]
# Отключаем все проверки по умолчанию, включаем только критические
disable = [
    "all",
]

enable = [
    "import-error",           # Ошибки импорта
    "undefined-variable",     # Неопределенные переменные
    "used-before-assignment", # Использование до присвоения
    "unreachable",           # Недостижимый код
    "duplicate-key",         # Дублированные ключи
    "syntax-error",          # Синтаксические ошибки
]

# Максимальная длина строки
max-line-length = 88

# Игнорируем эти файлы/папки
ignore-paths = [
    "\\.venv.*",
    "\\.git.*",
    "__pycache__.*",
    ".*\\.pyc$",
    "offload.*",
    "qdrant_store.*",
    "data_spravedlivo.*",
]

[tool.pylint.messages_control]
# Отключаем конкретные предупреждения (стиль и качество кода)
disable = [
    "missing-module-docstring",
    "missing-function-docstring", 
    "missing-class-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "line-too-long",
    "invalid-name",
    "consider-using-f-string",
    "logging-fstring-interpolation",
    "logging-format-interpolation",
    "broad-except",
    "bare-except",
    "unused-argument",
    "unused-variable",
    "unused-import",
    "import-outside-toplevel",
    "global-statement",
    "global-variable-undefined",
    "redefined-outer-name",
]

[project.scripts]
# Основные команды для проверки кода
lint = "ruff check ."
lint-fix = "ruff check --fix ."
format = "ruff format ."
check-pylint = "pylint ."

# Комбинированные команды
check-all = "ruff check . && pylint ."
fix-all = "ruff check --fix . && ruff format ."
